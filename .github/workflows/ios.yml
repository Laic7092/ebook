name: iOS IPA

# 只做一件事：吐出一个未签名的 device .ipa（unsigned），拿去用 Sideloadly /
# AltStore 免费 Apple ID 重签后插线安装，或者越狱设备 / TrollStore 直接装。
#
# 运行：push 到 main，或 Actions 页面手动 Run workflow。

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Report Xcode
        run: xcodebuild -version

      # 引擎是 Rust 静态库，必须先交叉编译成 aarch64-apple-ios 再让 cgo 去链接。
      - name: Build the Rust engine (aarch64-apple-ios)
        run: |
          rustup target add aarch64-apple-ios
          ./scripts/build-engine.sh ios_arm64
          ls -lh internal/engine/native/ios_arm64/

      - name: Build the unsigned IPA
        run: bash .github/scripts/build-unsigned-ipa.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: build/ios-arm64/*-unsigned.ipa
          if-no-files-found: error
