name: iOS IPA

# 只做一件事：吐出一个未签名的 device .ipa（unsigned），拿去用 Sideloadly /
# AltStore 免费 Apple ID 重签后插线安装，或者越狱设备 / TrollStore 直接装。
#
# 运行：push 到 main，或 Actions 页面手动 Run workflow。

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Report Xcode
        run: xcodebuild -version

      # 引擎在另一个仓库里：Rust 静态库要先交叉编译成 aarch64-apple-ios，
      # cgo 才能在链接阶段找到 eb_* 这些符号。
      - name: Checkout the Rust engine
        uses: actions/checkout@v7
        with:
          repository: Laic7092/ebook-engine
          path: ebook-engine
          ref: main

      # mygo 没有给 iOS 最终链接加输入的口子，cgo 的 LDFLAGS 在 c-archive
      # 模式下也不生效；用一个三行补丁让它读 MYGO_IOS_LINK_FLAGS。
      - name: Build mygo with the iOS link flags patch
        run: |
          git clone --depth 1 --branch v0.10.0 https://github.com/egoist/mygo "$RUNNER_TEMP/mygo-src"
          python3 .github/scripts/patch-mygo-ios-link.py "$RUNNER_TEMP/mygo-src/cmd/mygo/ios.go"
          (cd "$RUNNER_TEMP/mygo-src" && go build -o "$RUNNER_TEMP/bin/mygo" ./cmd/mygo)
          "$RUNNER_TEMP/bin/mygo" --version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build the Rust engine (aarch64-apple-ios)
        env:
          ENGINE_DIR: ${{ github.workspace }}/ebook-engine
        run: |
          ./scripts/build-engine.sh ios_arm64
          ls -lh internal/engine/native/ios_arm64/

      - name: Build the unsigned IPA
        run: bash .github/scripts/build-unsigned-ipa.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: build/ios-arm64/*-unsigned.ipa
          if-no-files-found: error
